nginx:
  sites_enabled_dir: /etc/nginx/sites-enabled
  include_globs:
    - /etc/nginx/**/*.conf

scanner:
  default_roots:
    - /home/webserv
  scan_interval_minutes: 60
  command_timeout_seconds: 120
  network_timeout_seconds: 30
  max_include_depth: 4
  max_directory_walk_depth: 3
  repeated_failure_threshold: 3
  resolve_local_proxy_processes: true
  local_proxy_root_hints:
    - /home/webserv
    - /srv
    - /opt

# Interpreter/runtime CVEs are separate from npm/Composer/PyPI dependencies.
# Automatic association uses listening local processes, never PATH guesses.
runtime_audit:
  enabled: true
  cache_ttl_hours: 24
  bindings: []
  # Explicit administrator association for a stopped/non-discoverable backend:
  # - vhost: app.example.test
  #   kind: php  # php, node, python
  #   executable: /opt/php/current/sbin/php-fpm
  #   repository_path: /srv/example-app

notifications:
  email_to:
    - root@localhost
  email_from: cerberus@localhost
  method: sendmail
  sendmail_path: /usr/sbin/sendmail
  smtp_host: 127.0.0.1
  smtp_port: 25
  smtp_ssl: false
  smtp_starttls: false
  smtp_username: ""
  smtp_password: ""
  smtp_password_env: ""
  max_emails_per_run: 20
  summary_only: true

state:
  state_dir: /var/lib/vhost-cve-monitor
  database_path: /var/lib/vhost-cve-monitor/state.db
  cve_cache_ttl_hours: 24
  cache_grace_hours: 168

logging:
  level: INFO
  file: /var/log/vhost-cve-monitor.log

filters:
  vhost_allowlist: []
  vhost_blocklist:
    - default
    - _
  path_allowlist: []
  path_blocklist: []

# Optional AI-assisted static triage through Codex CLI.
# Disabled by default. The scanner severity remains authoritative.
codex_analysis:
  enabled: false
  executable: codex
  codex_home: ""
  language: en
  model: ""
  timeout_seconds: 180
  retry_attempts: 1
  retry_delay_seconds: 10
  maximum_output_bytes: 65536
  maximum_findings_per_run: 10
  minimum_severity: MEDIUM
  repository_path: ""
  sandbox: read-only
  network_access: false
  ignore_user_config: true
  skip_git_repo_check: true
  cache_ttl_seconds: 86400
  include_failure_diagnostics: true
  prompt_template: ""
